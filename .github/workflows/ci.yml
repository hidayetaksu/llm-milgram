name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests (coverage gate = 100%; includes the full mock collect->tables->analyze->figures->report chain)
        run: uv run pytest --cov=src --cov-report=term-missing
